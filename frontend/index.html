<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Auth</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg2: #121826;
      --panel: #141d2d;
      --panel-soft: #182338;
      --line: #26344f;
      --text: #e6edf7;
      --muted: #9aa9c2;
      --brand: #58a6ff;
      --ok: #2ea76b;
      --warn: #d69d3e;
      --err: #d46868;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, #1a2540 0%, transparent 38%),
        radial-gradient(circle at 85% 20%, #172236 0%, transparent 35%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      padding: 16px;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(520px, 100%);
    }

    .panel {
      background: linear-gradient(180deg, rgba(20, 29, 45, 0.95), rgba(16, 24, 37, 0.95));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 34px rgba(2, 7, 14, 0.45);
      padding: 18px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
      background: #0f1625;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: #9fb0cc;
      border-radius: 10px;
      padding: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #1d2a42;
      color: #dce9fc;
      box-shadow: 0 8px 16px rgba(5, 12, 24, 0.36);
    }

    .status {
      display: none;
      margin-top: 12px;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .status.show { display: block; }
    .status.ok { background: rgba(46, 167, 107, 0.17); color: #8fe0b4; border: 1px solid rgba(46, 167, 107, 0.35); }
    .status.err { background: rgba(212, 104, 104, 0.16); color: #f3b6b6; border: 1px solid rgba(212, 104, 104, 0.35); }
    .status.warn { background: rgba(214, 157, 62, 0.14); color: #f4cd8e; border: 1px solid rgba(214, 157, 62, 0.35); }

    .form-wrap { display: none; margin-top: 12px; }
    .form-wrap.active { display: block; }

    form { display: grid; gap: 10px; }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: #b6c4db;
      font-weight: 600;
    }

    .field { position: relative; }

    input {
      width: 100%;
      border: 1px solid #31415f;
      border-radius: 10px;
      background: #0f1726;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
    }

    input:focus {
      outline: none;
      border-color: #4a78d0;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.18);
    }

    .toggle-pass {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid #30435f;
      background: #16233a;
      color: #b4c4e0;
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .helper-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    .check { display: inline-flex; align-items: center; gap: 6px; }
    .check input { width: auto; margin: 0; }

    .submit {
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3472d8, #58a6ff);
      color: #fff;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit:disabled { opacity: 0.65; cursor: wait; }

  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1 id="pageTitle">Register Account</h1>
      <p class="subtitle" id="pageSubtitle">สร้างบัญชีและเข้าสู่ระบบเพื่อใช้งาน profile/task service</p>

      <div class="mode-row">
        <button type="button" class="mode-btn active" data-mode="register">Register</button>
        <button type="button" class="mode-btn" data-mode="login">Login</button>
      </div>

      <div id="status" class="status"></div>

      <section class="form-wrap active" id="registerWrap">
        <form id="registerForm">
          <label>
            Username
            <input id="registerUsername" type="text" minlength="3" placeholder="username" required>
          </label>
          <label>
            Email
            <input id="registerEmail" type="email" placeholder="you@example.com" required>
          </label>
          <label>
            Password
            <div class="field">
              <input id="registerPassword" type="password" minlength="6" placeholder="ขั้นต่ำ 6 ตัว" required>
              <button type="button" class="toggle-pass" data-toggle="registerPassword">SHOW</button>
            </div>
          </label>
          <button class="submit" id="registerButton" type="submit">Create Account</button>
        </form>
      </section>

      <section class="form-wrap" id="loginWrap">
        <form id="loginForm">
          <label>
            Email
            <input id="loginEmail" type="email" placeholder="you@example.com" required>
          </label>
          <label>
            Password
            <div class="field">
              <input id="loginPassword" type="password" placeholder="password" required>
              <button type="button" class="toggle-pass" data-toggle="loginPassword">SHOW</button>
            </div>
          </label>

          <div class="helper-row">
            <label class="check"><input id="rememberMe" type="checkbox">Remember me</label>
            <span>auth-service</span>
          </div>

          <button class="submit" id="loginButton" type="submit">Login</button>
        </form>
      </section>

    </section>
  </main>

  <script src="config.js"></script>
  <script>
    const CONFIG = window.APP_CONFIG || {};
    const TOK_KEY = 'jwt_token';
    const USER_KEY = 'auth_user';

    const refs = {
      pageTitle: document.getElementById('pageTitle'),
      pageSubtitle: document.getElementById('pageSubtitle'),
      status: document.getElementById('status'),
      registerWrap: document.getElementById('registerWrap'),
      loginWrap: document.getElementById('loginWrap'),
      registerForm: document.getElementById('registerForm'),
      loginForm: document.getElementById('loginForm'),
      registerUsername: document.getElementById('registerUsername'),
      registerEmail: document.getElementById('registerEmail'),
      registerPassword: document.getElementById('registerPassword'),
      loginEmail: document.getElementById('loginEmail'),
      loginPassword: document.getElementById('loginPassword'),
      registerButton: document.getElementById('registerButton'),
      loginButton: document.getElementById('loginButton'),
      modeButtons: Array.from(document.querySelectorAll('[data-mode]')),
      toggles: Array.from(document.querySelectorAll('[data-toggle]'))
    };

    let mode = 'register';

    function endpointFromConfig(key, fallbackPath) {
      const endpoints = CONFIG.ENDPOINTS || {};
      if (endpoints[key]) return endpoints[key];
      if (CONFIG.AUTH_URL) return `${CONFIG.AUTH_URL}${fallbackPath}`;
      return fallbackPath;
    }

    function parseJsonText(text) {
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        return { message: text };
      }
    }

    async function request(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();
      const data = parseJsonText(text);
      if (!res.ok) {
        throw new Error(data.error || data.message || `Request failed (${res.status})`);
      }
      return data;
    }

    function setBusy(button, busy, idle) {
      button.disabled = busy;
      button.textContent = busy ? 'Processing...' : idle;
    }

    function setStatus(type, text) {
      refs.status.className = `status ${type}${text ? ' show' : ''}`;
      refs.status.textContent = text || '';
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isRegister = mode === 'register';

      refs.registerWrap.classList.toggle('active', isRegister);
      refs.loginWrap.classList.toggle('active', !isRegister);
      refs.pageTitle.textContent = isRegister ? 'Register Account' : 'Login Account';
      refs.pageSubtitle.textContent = isRegister
        ? 'สร้างบัญชีและเข้าสู่ระบบเพื่อใช้งาน profile/task service'
        : 'เข้าสู่ระบบแล้วไปจัดการ profile และ tasks ได้ทันที';

      refs.modeButtons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      setStatus('', '');
    }

    function bindPasswordToggle() {
      refs.toggles.forEach((button) => {
        button.addEventListener('click', () => {
          const target = document.getElementById(button.dataset.toggle);
          if (!target) return;
          const nextType = target.type === 'password' ? 'text' : 'password';
          target.type = nextType;
          button.textContent = nextType === 'password' ? 'SHOW' : 'HIDE';
        });
      });
    }

    async function onRegisterSubmit(event) {
      event.preventDefault();
      const endpoint = endpointFromConfig('register', '/api/auth/register');

      setBusy(refs.registerButton, true, 'Create Account');
      try {
        const payload = {
          username: refs.registerUsername.value.trim(),
          email: refs.registerEmail.value.trim(),
          password: refs.registerPassword.value
        };

        const data = await request(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        setStatus('ok', data.message || 'สมัครสำเร็จ กรุณาเข้าสู่ระบบ');
        refs.loginEmail.value = payload.email;
        refs.loginPassword.value = payload.password;
        refs.registerForm.reset();
        setMode('login');
      } catch (error) {
        setStatus('err', error.message);
      } finally {
        setBusy(refs.registerButton, false, 'Create Account');
      }
    }

    async function onLoginSubmit(event) {
      event.preventDefault();
      const endpoint = endpointFromConfig('login', '/api/auth/login');

      setBusy(refs.loginButton, true, 'Login');
      try {
        const payload = {
          email: refs.loginEmail.value.trim(),
          password: refs.loginPassword.value
        };

        const data = await request(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        localStorage.setItem(TOK_KEY, data.token || '');
        localStorage.setItem(USER_KEY, JSON.stringify(data.user || {}));
        setStatus('ok', 'เข้าสู่ระบบสำเร็จ กำลังไปหน้า profile...');
        setTimeout(() => { window.location.href = 'profile.html'; }, 450);
      } catch (error) {
        setStatus('err', error.message);
      } finally {
        setBusy(refs.loginButton, false, 'Login');
      }
    }

    function initUI() {
      setMode('register');

      refs.modeButtons.forEach((button) => {
        button.addEventListener('click', () => setMode(button.dataset.mode));
      });

      refs.registerForm.addEventListener('submit', onRegisterSubmit);
      refs.loginForm.addEventListener('submit', onLoginSubmit);
    }

    initUI();
    bindPasswordToggle();
  </script>
</body>
</html>
