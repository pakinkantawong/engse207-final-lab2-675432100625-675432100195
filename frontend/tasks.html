<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Task Service</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg2: #121927;
      --panel: #151f30;
      --line: #2a3b58;
      --text: #e8eff9;
      --muted: #9badca;
      --brand: #5aa7ff;
      --ok: #35b879;
      --warn: #d8a449;
      --err: #da7272;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, #1b2a48 0%, transparent 36%),
        radial-gradient(circle at 85% 18%, #16243d 0%, transparent 34%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      padding: 16px;
    }

    .shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .card {
      background: linear-gradient(180deg, rgba(21, 31, 48, 0.95), rgba(15, 23, 36, 0.95));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 34px rgba(2, 7, 14, 0.45);
      padding: 16px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: 26px; }

    .muted { color: var(--muted); font-size: 14px; line-height: 1.65; }

    .chip-row,
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .chip {
      border: 1px solid #30425f;
      border-radius: 999px;
      background: #101a2b;
      color: #abc0e1;
      padding: 6px 10px;
      font-size: 12px;
    }

    .chip.ok { background: rgba(53, 184, 121, 0.16); color: #95e2b9; border-color: rgba(53, 184, 121, 0.35); }
    .chip.warn { background: rgba(216, 164, 73, 0.14); color: #f2cf95; border-color: rgba(216, 164, 73, 0.35); }
    .chip.err { background: rgba(218, 114, 114, 0.16); color: #f0bebd; border-color: rgba(218, 114, 114, 0.35); }

    .btn {
      border: 1px solid #314462;
      border-radius: 10px;
      background: #101b2e;
      color: #dce8fb;
      text-decoration: none;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.primary { background: #17345a; border-color: #356aa8; }
    .btn.danger { background: rgba(218, 114, 114, 0.12); color: #f0b9b9; border-color: rgba(218, 114, 114, 0.35); }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 14px;
    }

    form { display: grid; gap: 10px; }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: #b7c6de;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #334a6d;
      border-radius: 10px;
      background: #0f1829;
      color: var(--text);
      padding: 10px 11px;
      font: inherit;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #5a92f0;
      box-shadow: 0 0 0 3px rgba(90, 146, 240, 0.2);
    }

    textarea { min-height: 110px; resize: vertical; line-height: 1.6; }

    .inline-msg {
      display: none;
      margin-top: 10px;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .inline-msg.show { display: block; }
    .inline-msg.ok { background: rgba(53, 184, 121, 0.16); color: #95e2b9; border: 1px solid rgba(53, 184, 121, 0.35); }
    .inline-msg.warn { background: rgba(216, 164, 73, 0.14); color: #f2cf95; border: 1px solid rgba(216, 164, 73, 0.35); }
    .inline-msg.err { background: rgba(218, 114, 114, 0.16); color: #f0bebd; border: 1px solid rgba(218, 114, 114, 0.35); }

    .list {
      display: grid;
      gap: 10px;
      max-height: 64vh;
      overflow: auto;
      padding-right: 2px;
    }

    .task {
      border: 1px solid #2b3d5c;
      border-radius: 10px;
      background: #0f1829;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .task h3 { margin: 0; font-size: 16px; }

    .task .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .task .desc {
      white-space: pre-wrap;
      color: #c9d7ee;
      font-size: 14px;
      line-height: 1.6;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .actions-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card top">
      <div>
        <h1>Task Service</h1>
        <p class="muted">จัดการงานผ่าน <code>/api/tasks</code> ด้วย token จาก localStorage</p>
        <div class="chip-row" style="margin-top:10px;">
          <span class="chip" id="modeChip">mode: -</span>
          <span class="chip" id="endpointChip">endpoint: -</span>
          <span class="chip" id="sessionChip">session: checking...</span>
          <span class="chip" id="countChip">tasks: 0</span>
        </div>
      </div>

      <div class="actions">
        <a class="btn" href="profile.html">Profile</a>
        <a class="btn" href="profile-editor.html">Edit Profile</a>
        <button type="button" class="btn danger" id="logoutButton">Logout</button>
      </div>
    </section>

    <section class="grid">
      <article class="card">
        <h2 style="margin-bottom:10px;">Create New Task</h2>
        <form id="createForm">
          <label>
            Title
            <input id="taskTitle" type="text" maxlength="120" placeholder="เช่น ตรวจเอกสาร API" required>
          </label>

          <label>
            Description
            <textarea id="taskDescription" maxlength="800" placeholder="รายละเอียดงาน"></textarea>
          </label>

          <div class="row">
            <label>
              Status
              <select id="taskStatus">
                <option value="TODO">TODO</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="DONE">DONE</option>
              </select>
            </label>

            <label>
              Priority
              <select id="taskPriority">
                <option value="low">low</option>
                <option value="medium" selected>medium</option>
                <option value="high">high</option>
              </select>
            </label>
          </div>

          <div class="actions-inline">
            <button class="btn primary" id="createButton" type="submit">Create Task</button>
            <button class="btn" id="reloadButton" type="button">Reload</button>
          </div>
        </form>

        <div id="inlineMsg" class="inline-msg"></div>
      </article>

      <article class="card">
        <h2 style="margin-bottom:10px;">Task List</h2>
        <div class="list" id="taskList"></div>
      </article>
    </section>
  </main>

  <script src="config.js"></script>
  <script>
    const CONFIG = window.APP_CONFIG || {};
    const TOKEN_KEY = 'jwt_token';
    const USER_KEY = 'auth_user';

    const refs = {
      modeChip: document.getElementById('modeChip'),
      endpointChip: document.getElementById('endpointChip'),
      sessionChip: document.getElementById('sessionChip'),
      countChip: document.getElementById('countChip'),
      taskList: document.getElementById('taskList'),
      createForm: document.getElementById('createForm'),
      taskTitle: document.getElementById('taskTitle'),
      taskDescription: document.getElementById('taskDescription'),
      taskStatus: document.getElementById('taskStatus'),
      taskPriority: document.getElementById('taskPriority'),
      createButton: document.getElementById('createButton'),
      reloadButton: document.getElementById('reloadButton'),
      inlineMsg: document.getElementById('inlineMsg'),
      logoutButton: document.getElementById('logoutButton')
    };

    const state = {
      token: localStorage.getItem(TOKEN_KEY) || ''
    };

    function inferTaskServiceBaseUrl() {
      const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
      const hostname = window.location.hostname || 'localhost';
      return `${protocol}//${hostname}:3002`;
    }

    function tasksEndpoint() {
      const isLocalHost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if (isLocalHost) return '/api/tasks';
      if (CONFIG.ENDPOINTS && CONFIG.ENDPOINTS.tasks) return CONFIG.ENDPOINTS.tasks;
      if (CONFIG.TASK_URL) return `${CONFIG.TASK_URL}/api/tasks`;
      return `${inferTaskServiceBaseUrl()}/api/tasks`;
    }

    function parseJsonText(text) {
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        return { message: text };
      }
    }

    async function request(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();
      const data = parseJsonText(text);
      if (!res.ok) {
        throw new Error(data.error || data.message || `Request failed (${res.status})`);
      }
      return data;
    }

    function authHeaders(withJson = false) {
      const headers = {};
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (withJson) headers['Content-Type'] = 'application/json';
      return headers;
    }

    function setInline(type, text) {
      refs.inlineMsg.className = `inline-msg ${type}${text ? ' show' : ''}`;
      refs.inlineMsg.textContent = text || '';
    }

    function setSessionChip() {
      if (!state.token) {
        refs.sessionChip.textContent = 'session: not found';
        refs.sessionChip.className = 'chip err';
        return false;
      }
      refs.sessionChip.textContent = 'session: ready';
      refs.sessionChip.className = 'chip ok';
      return true;
    }

    function renderEmpty(text) {
      refs.taskList.innerHTML = `<div class="task"><div class="muted">${text}</div></div>`;
      refs.countChip.textContent = 'tasks: 0';
    }

    function createSelect(options, current, className) {
      const select = document.createElement('select');
      select.className = className;
      options.forEach((opt) => {
        const option = document.createElement('option');
        option.value = opt;
        option.textContent = opt;
        option.selected = opt === current;
        select.appendChild(option);
      });
      return select;
    }

    async function updateTaskQuick(id, payload) {
      await request(`${tasksEndpoint()}/${id}`, {
        method: 'PUT',
        headers: authHeaders(true),
        body: JSON.stringify(payload)
      });
      await loadTasks();
      setInline('ok', `อัปเดต task #${id} สำเร็จ`);
    }

    async function deleteTask(id) {
      await request(`${tasksEndpoint()}/${id}`, {
        method: 'DELETE',
        headers: authHeaders()
      });
      await loadTasks();
      setInline('warn', `ลบ task #${id} แล้ว`);
    }

    function renderTasks(tasks) {
      refs.taskList.innerHTML = '';
      refs.countChip.textContent = `tasks: ${tasks.length}`;

      if (!tasks.length) {
        renderEmpty('ยังไม่มีงาน ลองสร้าง task ใหม่');
        return;
      }

      tasks.forEach((task) => {
        const card = document.createElement('article');
        card.className = 'task';

        const title = document.createElement('h3');
        title.textContent = task.title || '(untitled)';

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `#${task.id} • ${new Date(task.updated_at || task.created_at || Date.now()).toLocaleString('th-TH')}`;

        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = task.description || 'ไม่มีรายละเอียด';

        const row = document.createElement('div');
        row.className = 'row';
        row.style.display = 'none';

        const statusSelect = createSelect(['TODO', 'IN_PROGRESS', 'DONE'], task.status || 'TODO');
        const prioritySelect = createSelect(['low', 'medium', 'high'], task.priority || 'medium');

        row.appendChild(statusSelect);
        row.appendChild(prioritySelect);

        const actions = document.createElement('div');
        actions.className = 'actions-inline';

        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn primary';
        saveBtn.type = 'button';
        saveBtn.textContent = 'Edit';
        saveBtn.addEventListener('click', async () => {
          if (row.style.display === 'none') {
            row.style.display = 'grid';
            saveBtn.textContent = 'Save';
            return;
          }
          try {
            await updateTaskQuick(task.id, {
              status: statusSelect.value,
              priority: prioritySelect.value
            });
            row.style.display = 'none';
            saveBtn.textContent = 'Edit';
          } catch (error) {
            setInline('err', error.message);
          }
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn danger';
        deleteBtn.type = 'button';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', async () => {
          try {
            await deleteTask(task.id);
          } catch (error) {
            setInline('err', error.message);
          }
        });

        actions.appendChild(saveBtn);
        actions.appendChild(deleteBtn);

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(desc);
        card.appendChild(row);
        card.appendChild(actions);
        refs.taskList.appendChild(card);
      });
    }

    async function loadTasks() {
      if (!setSessionChip()) {
        renderEmpty('ไม่พบ token กรุณา login ก่อน');
        return;
      }

      setInline('warn', 'กำลังโหลด task list...');
      try {
        const data = await request(tasksEndpoint(), {
          headers: authHeaders()
        });
        renderTasks(data.tasks || []);
        setInline('ok', 'โหลด tasks สำเร็จ');
      } catch (error) {
        renderEmpty(error.message);
        setInline('err', error.message);
      }
    }

    async function createTask(event) {
      event.preventDefault();
      if (!setSessionChip()) {
        setInline('err', 'ไม่พบ token กรุณา login ก่อน');
        return;
      }

      refs.createButton.disabled = true;
      refs.createButton.textContent = 'Creating...';

      try {
        const payload = {
          title: refs.taskTitle.value.trim(),
          description: refs.taskDescription.value.trim(),
          status: refs.taskStatus.value,
          priority: refs.taskPriority.value
        };

        await request(tasksEndpoint(), {
          method: 'POST',
          headers: authHeaders(true),
          body: JSON.stringify(payload)
        });

        refs.createForm.reset();
        refs.taskStatus.value = 'TODO';
        refs.taskPriority.value = 'medium';

        await loadTasks();
        setInline('ok', 'สร้าง task สำเร็จ');
      } catch (error) {
        setInline('err', error.message);
      } finally {
        refs.createButton.disabled = false;
        refs.createButton.textContent = 'Create Task';
      }
    }

    function initStatic() {
      refs.modeChip.textContent = `mode: ${CONFIG.MODE || '-'}`;
      refs.endpointChip.textContent = `endpoint: ${tasksEndpoint()}`;
      refs.logoutButton.addEventListener('click', () => {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        window.location.href = 'index.html';
      });
      refs.reloadButton.addEventListener('click', loadTasks);
      refs.createForm.addEventListener('submit', createTask);
    }

    initStatic();
    loadTasks();
  </script>
</body>
</html>
